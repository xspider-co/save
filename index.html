<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Viewport obligatorio para móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CCA — Cuba Content Awards</title>
  <meta name="theme-color" content="#091A51" />
  <meta name="description" content="Cuba Content Awards" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Marca discreta, arriba a la izquierda -->
  <header class="brand-mark" aria-hidden="false">CUBA CONTENT AWARDS</header>

  <!-- Fecha/lugar discretos, arriba a la derecha -->
  <div class="event-meta event-meta--top">05 · 12 · 2026 — LA HABANA</div>

  <main class="stage">

    <!-- ============================================= -->
    <!-- 👉 CAMBIAR AQUÍ LA FRASE PRINCIPAL             -->
    <!-- Mantenerla breve; el tamaño se ajusta solo.    -->
    <!-- ============================================= -->
    <p class="phrase">“Estés donde estés, esta historia también es tuya.”</p>

    <!-- Contador en tiempo real. La fecha se define en script.js -->
    <div class="countdown" id="countdown" aria-live="polite">
      <div class="countdown__unit">
        <span class="countdown__value" id="cd-days">00</span>
        <span class="countdown__label">Días</span>
      </div>
      <div class="countdown__sep" aria-hidden="true">·</div>
      <div class="countdown__unit">
        <span class="countdown__value" id="cd-hours">00</span>
        <span class="countdown__label">Horas</span>
      </div>
      <div class="countdown__sep" aria-hidden="true">·</div>
      <div class="countdown__unit">
        <span class="countdown__value" id="cd-minutes">00</span>
        <span class="countdown__label">Minutos</span>
      </div>
    </div>

    <!-- Añadir un <li> por patrocinador cuando entre. -->
    <section class="sponsors" aria-label="Patrocinadores">
      <p class="sponsors__label">Patrocinado por</p>
      <ul class="sponsors__list">
        <li>
          <img
            class="sponsors__logo"
            src="sponsors/aserecar-web.png"
            alt="Aserecar"
            width="318"
            height="320"
          />
        </li>
      </ul>
    </section>

  </main>

  <footer class="footer">
    <a
      class="footer__tag"
      href="https://www.instagram.com/cca.cuba/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram de CCA Cuba"
    >@cca.cuba</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
